; FileCopyHtml 設定ファイル
; このファイルをブラウザで「config.ini を選択…」すると、
; HTML を開いたときに自動的に読み込まれ、フォルダ変更のたびに上書き保存されます。
;
; パスの記入例:
;   ローカル    C:\Data\dest
;   ネットワーク \\server\share\dest      ← 共有名まで入力
;   マップドドライブ Z:\dest
;   ※「パス」欄の入力は ini への記録用です。実際にファイルを操作するには
;     各枠の「選択…」からフォルダを選んでください（ブラウザの仕様上必須）。
;
[FileCopyHtml]
Version=1
Destination=
Source1=
Source2=
Source3=
KeepTree=true
Overwrite=true
